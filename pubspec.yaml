name: hisn_almuslim_app
description: "حصن المسلم — Hisn Al-Muslim: authentic daily adhkar and supplications, fully offline."
publish_to: 'none'

# version: <versionName>+<versionCode>. Increase the build number (after +)
# for every upload to Google Play / App Store Connect.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.2
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/fonts/OFL-Amiri.txt
    - assets/fonts/OFL-AmiriQuran.txt
    - assets/fonts/OFL-IBMPlexSansArabic.txt

  fonts:
    # UI typeface (Arabic + Latin).
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Reading typeface for adhkar.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Quranic text.
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
